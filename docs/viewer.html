<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screencast — Viewer</title>
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#0b0d10">
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot" id="dot"></span><b>SCREENCAST</b> · viewer</div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="status" id="wsStatus">connecting…</div>
      <button id="retryBtn" class="secondary" style="display:none; padding:6px 12px; font-size:12px;">Retry now</button>
    </div>
  </div>

  <main>
    <div class="config" id="configRow" style="display:none;">
      <label for="signalUrl">Signaling server</label>
      <input id="signalUrl" type="text" placeholder="wss://your-app.onrender.com" autocomplete="off">
      <button id="saveUrlBtn" class="secondary">Connect</button>
    </div>

    <div class="stage" id="stage">
      <video id="remote" autoplay playsinline></video>
      <div class="placeholder" id="placeholder">Waiting for the host to start sharing…</div>
    </div>
    <button id="controlBtn" class="secondary" style="display:none;">Take control</button>
    <button id="fullscreenBtn" class="secondary">Fullscreen</button>
    <div class="footer-note">
      You're watching a live local screen share. Nothing was installed —
      this is just a browser tab.
    </div>
  </main>

<script>
const dot = document.getElementById('dot');
const wsStatus = document.getElementById('wsStatus');
const retryBtn = document.getElementById('retryBtn');
const remote = document.getElementById('remote');
remote.addEventListener('pause', () => { remote.play().catch(() => {}); });
const placeholder = document.getElementById('placeholder');

let ws;
let pc;

const STORAGE_KEY = 'screencast:signalUrl';
const configRow = document.getElementById('configRow');
const signalUrlInput = document.getElementById('signalUrl');
const saveUrlBtn = document.getElementById('saveUrlBtn');

function resolveSignalUrl() {
  const fromQuery = new URLSearchParams(location.search).get('signal');
  if (fromQuery) {
    try { localStorage.setItem(STORAGE_KEY, fromQuery); } catch {}
    return fromQuery;
  }
  try { return localStorage.getItem(STORAGE_KEY) || ''; } catch { return ''; }
}

signalUrlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') saveUrlBtn.click();
});
saveUrlBtn.addEventListener('click', () => {
  const url = signalUrlInput.value.trim();
  if (!url) return;
  try { localStorage.setItem(STORAGE_KEY, url); } catch {}
  configRow.style.display = 'none';
  connectWS();
});

function setDot(state) {
  dot.className = 'dot' + (state === 'live' ? ' live' : state === 'wait' ? ' wait' : '');
}

let retryAttempt = 0;
let retryTimer = null;
let connectingTimer = null;

function stopTimers() {
  if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }
  if (connectingTimer) { clearInterval(connectingTimer); connectingTimer = null; }
}

function scheduleRetry() {
  retryBtn.style.display = 'inline-block';
  retryAttempt++;
  const delaySec = Math.min(1 + retryAttempt, 5);
  let remaining = delaySec;
  wsStatus.textContent = `disconnected — retrying in ${remaining}s`;
  retryTimer = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(retryTimer);
      retryTimer = null;
      connectWS();
    } else {
      wsStatus.textContent = `disconnected — retrying in ${remaining}s`;
    }
  }, 1000);
}

retryBtn.addEventListener('click', () => {
  stopTimers();
  connectWS();
});

function connectWS() {
  stopTimers();
  const url = resolveSignalUrl();
  if (!url) {
    configRow.style.display = 'flex';
    wsStatus.textContent = 'ask the host for their signaling server link';
    retryBtn.style.display = 'none';
    setDot('off');
    return;
  }

  retryBtn.style.display = 'none';
  let elapsed = 0;
  wsStatus.textContent = 'connecting…';
  connectingTimer = setInterval(() => {
    elapsed++;
    let note = '';
    if (elapsed > 8) note = ' (free hosting can take up to ~50s to wake up)';
    wsStatus.textContent = `connecting… ${elapsed}s${note}`;
  }, 1000);

  ws = new WebSocket(url);

  ws.onopen = () => {
    stopTimers();
    retryAttempt = 0;
    retryBtn.style.display = 'none';
    wsStatus.textContent = 'signaling connected';
    ws.send(JSON.stringify({ type: 'register-viewer' }));
  };
  ws.onclose = () => {
    stopTimers();
    if (!resolveSignalUrl()) return;
    setDot('off');
    scheduleRetry();
  };
  ws.onerror = () => ws.close();

  ws.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);

    if (msg.type === 'viewer-id') {
      setDot(msg.hostOnline ? 'wait' : 'off');
      wsStatus.textContent = msg.hostOnline ? 'waiting for stream…' : 'no host broadcasting yet';
    } else if (msg.type === 'offer') {
      await handleOffer(msg.offer);
    } else if (msg.type === 'ice-candidate') {
      if (pc && msg.candidate) {
        try { await pc.addIceCandidate(msg.candidate); } catch (e) { console.warn(e); }
      }
    } else if (msg.type === 'host-left') {
      teardown();
    }
  };
}

async function handleOffer(offer) {
  teardown();
  pc = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
  });

  pc.ontrack = (e) => {
    remote.srcObject = e.streams[0];
    placeholder.style.display = 'none';
    setDot('live');
    wsStatus.textContent = 'live';

    // Trim the jitter buffer for lower end-to-end latency (Chrome/Edge).
    for (const receiver of pc.getReceivers()) {
      if ('playoutDelayHint' in receiver) receiver.playoutDelayHint = 0;
    }
  };

  pc.ondatachannel = (e) => {
    if (e.channel.label === 'input') {
      inputChannel = e.channel;
      inputChannel.onopen = () => { controlBtn.style.display = 'inline-block'; };
      inputChannel.onclose = () => { controlBtn.style.display = 'none'; setControlActive(false); };
    }
  };

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      ws.send(JSON.stringify({ type: 'ice-candidate', candidate: e.candidate }));
    }
  };

  pc.onconnectionstatechange = () => {
    if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) {
      teardown();
    }
  };

  await pc.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  ws.send(JSON.stringify({ type: 'answer', answer }));
}

function teardown() {
  if (pc) { pc.close(); pc = null; }
  remote.srcObject = null;
  placeholder.style.display = 'block';
  placeholder.textContent = 'Waiting for the host to start sharing…';
  setDot('wait');
  wsStatus.textContent = 'waiting for stream…';
  controlBtn.style.display = 'none';
  setControlActive(false);
  inputChannel = null;
}

// --- Remote control (mouse/keyboard forwarding) ---
const stage = document.getElementById('stage');
const controlBtn = document.getElementById('controlBtn');
let inputChannel = null;
let controlActive = false;

function setControlActive(on) {
  controlActive = on;
  controlBtn.textContent = on ? 'Release control (Esc)' : 'Take control';
  stage.style.outline = on ? '2px solid var(--signal)' : 'none';
  if (on) stage.setAttribute('tabindex', '0'), stage.focus();
}

controlBtn.addEventListener('click', () => setControlActive(!controlActive));

const fullscreenBtn = document.getElementById('fullscreenBtn');

function isFullscreen() {
  return document.fullscreenElement || document.webkitFullscreenElement;
}

function updateFullscreenLabel() {
  fullscreenBtn.textContent = isFullscreen() ? 'Exit fullscreen' : 'Fullscreen';
}

fullscreenBtn.addEventListener('click', async () => {
  try {
    if (!isFullscreen()) {
      if (stage.requestFullscreen) await stage.requestFullscreen();
      else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  } catch (e) { console.warn('Fullscreen failed:', e); }
});

document.addEventListener('fullscreenchange', updateFullscreenLabel);
document.addEventListener('webkitfullscreenchange', updateFullscreenLabel);

function sendInput(msg) {
  if (inputChannel && inputChannel.readyState === 'open') {
    inputChannel.send(JSON.stringify(msg));
  }
}

function relCoords(e) {
  const rect = remote.getBoundingClientRect();
  return {
    x: Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)),
    y: Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height))
  };
}

stage.addEventListener('mousemove', (e) => {
  if (!controlActive) return;
  sendInput({ type: 'mousemove', ...relCoords(e) });
});
stage.addEventListener('mousedown', (e) => {
  if (!controlActive) return;
  e.preventDefault();
  sendInput({ type: 'mousedown', button: e.button, ...relCoords(e) });
});
stage.addEventListener('mouseup', (e) => {
  if (!controlActive) return;
  e.preventDefault();
  sendInput({ type: 'mouseup', button: e.button, ...relCoords(e) });
});
stage.addEventListener('wheel', (e) => {
  if (!controlActive) return;
  e.preventDefault();
  sendInput({ type: 'wheel', deltaY: e.deltaY });
}, { passive: false });
stage.addEventListener('contextmenu', (e) => { if (controlActive) e.preventDefault(); });

stage.addEventListener('keydown', (e) => {
  if (!controlActive) return;
  if (e.key === 'Escape') { setControlActive(false); return; }
  e.preventDefault();
  sendInput({ type: 'keydown', key: e.key });
});
stage.addEventListener('keyup', (e) => {
  if (!controlActive) return;
  e.preventDefault();
  sendInput({ type: 'keyup', key: e.key });
});

setDot('off');
connectWS();
</script>
</body>
</html>
